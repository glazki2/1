<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Конспект</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='1' width='12' height='14' rx='1' fill='%23fff' stroke='%23999'/><path d='M5 5h6M5 8h6M5 11h4' stroke='%23999'/></svg>">
<style>
:root{--ink:#2b2b2b;--mute:#a3a3a3;--line:#ececec}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#fff;color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;background:none}

header{position:relative;padding:18px 20px 10px;padding-top:max(18px,env(safe-area-inset-top))}
header h1{font-size:22px;font-weight:normal}
header .date{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
#dot{width:5px;height:5px;border-radius:50%;background:transparent}
/* невидимое поле кода поверх заголовка */
#code{position:absolute;inset:0;width:100%;opacity:0;border:0;font-size:16px;cursor:text}

#list{flex:1;overflow-y:auto;padding:4px 20px 16px}
.msg{padding:8px 0;border-bottom:1px solid var(--line)}
.msg.me{padding-left:14px}
.msg pre{white-space:pre-wrap;word-break:break-word;font:inherit}
.meta{display:flex;gap:14px;margin-top:2px;font:12px system-ui,sans-serif;color:var(--mute)}
.meta span{flex:1}
.meta button{color:var(--mute);font-size:12px;padding:2px 0}
.meta button:hover{color:var(--ink)}
@media (hover:hover){.msg .meta button{visibility:hidden}.msg:hover .meta button{visibility:visible}}

form{display:none;gap:8px;padding:10px 20px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:0;padding:6px 0;font:inherit;color:var(--ink);max-height:35vh;background:transparent}
textarea:focus{outline:none}
form button{color:var(--mute);font:14px system-ui,sans-serif}
form button:hover{color:var(--ink)}
</style>
</head>
<body>

<header>
  <h1>Конспект</h1>
  <div class="date"><span id="today"></span><i id="dot"></i></div>
  <input id="code" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Код">
</header>
<div id="list"></div>
<form id="form">
  <textarea id="txt" rows="1" placeholder="Новая запись"></textarea>
  <button type="submit">Добавить</button>
</form>

<script>
const SERVER = 'https://ntfy.sh';
const SALT = 'bgd31-textchat-v1';   // поменяй на своё
const CHUNK = 1200;
const ME = Math.random().toString(36).slice(2, 10);

const $ = id => document.getElementById(id);
let es = null, topic = '', seen = new Set(), parts = {}, removed = new Set(), current = '';
const codeEl = $('code');
$('today').textContent = new Date().toLocaleDateString('ru', { day: 'numeric', month: 'long' });

const dot = c => $('dot').style.background = c;   // серый — подключение, красный — ошибка

codeEl.addEventListener('input', () => {
  codeEl.value = codeEl.value.replace(/\D/g, '').slice(0, 4);
  if (codeEl.value.length === 4) { if (codeEl.value !== current) join(codeEl.value); }
  else if (current) leave();
});
// чтобы после входа тап по заголовку давал заново ввести код
codeEl.addEventListener('focus', () => { if (current) { codeEl.value = ''; } });
codeEl.addEventListener('blur', () => { if (current && codeEl.value !== current) codeEl.value = current; });

// быстро спрятать: Esc на ПК
document.addEventListener('keydown', e => { if (e.key === 'Escape') { leave(); codeEl.value = ''; } });

async function hash(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 24);
}

async function join(c) {
  leave();
  current = c;
  topic = 'tc' + await hash(SALT + c);
  $('form').style.display = 'flex';
  codeEl.blur();
  connect();
}

function leave() {
  es && es.close(); es = null;
  current = ''; topic = '';
  seen.clear(); removed.clear(); parts = {};
  $('list').innerHTML = '';
  $('form').style.display = 'none';
  dot('transparent');
}

function connect() {
  dot(getComputedStyle(document.body).getPropertyValue('--line'));
  es = new EventSource(`${SERVER}/${topic}/sse?since=all`);
  es.onopen = () => dot('transparent');
  es.onerror = () => dot('#ddd');
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.event !== 'message' || seen.has(m.id)) return;
    seen.add(m.id);
    try { onPart(JSON.parse(m.message), m.time); } catch {}
  };
}

function onPart(p, time) {
  if (p.del) {                       // команда удаления
    removed.add(p.del);
    document.querySelector(`[data-id="${p.del}"]`)?.remove();
    return;
  }
  if (removed.has(p.m)) return;
  const box = parts[p.m] ||= { n: p.n, got: {}, s: p.s, time };
  box.got[p.i] = p.t;
  if (Object.keys(box.got).length < box.n) return;
  let text = '';
  for (let i = 0; i < box.n; i++) text += box.got[i];
  delete parts[p.m];
  render(p.m, text, box.s === ME, box.time);
}

function render(id, text, mine, time) {
  const el = document.createElement('div');
  el.className = 'msg' + (mine ? ' me' : '');
  el.dataset.id = id;
  const pre = document.createElement('pre');
  pre.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'meta';
  const info = document.createElement('span');
  info.textContent = new Date(time * 1000).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });

  const copy = document.createElement('button');
  copy.type = 'button';
  copy.textContent = 'копировать';
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); }
    copy.textContent = 'готово';
    setTimeout(() => copy.textContent = 'копировать', 1200);
  };

  const del = document.createElement('button');
  del.type = 'button';
  del.textContent = 'удалить';
  del.onclick = async () => {
    if (del.dataset.sure !== '1') {        // второй тап подтверждает
      del.dataset.sure = '1'; del.textContent = 'точно?';
      setTimeout(() => { del.dataset.sure = ''; del.textContent = 'удалить'; }, 2500);
      return;
    }
    el.remove(); removed.add(id);
    try { await post({ del: id }); } catch { dot('#e5a5a5'); }
  };

  meta.append(info, copy, del);
  el.append(pre, meta);
  const list = $('list');
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  list.append(el);
  if (atBottom || mine) list.scrollTop = list.scrollHeight;
}

async function post(obj) {
  const r = await fetch(`${SERVER}/${topic}`, { method: 'POST', body: JSON.stringify(obj) });
  if (!r.ok) throw new Error(r.status);
}

async function send(e) {
  e && e.preventDefault();
  const txt = $('txt');
  const text = txt.value;
  if (!text.trim() || !topic) return;
  txt.value = ''; grow();
  const id = Math.random().toString(36).slice(2, 12);
  const chunks = [];
  for (let i = 0; i < text.length; i += CHUNK) chunks.push(text.slice(i, i + CHUNK));
  try {
    for (let i = 0; i < chunks.length; i++) await post({ m: id, i, n: chunks.length, s: ME, t: chunks[i] });
  } catch {
    txt.value = text; grow();
    dot('#e5a5a5');
  }
}

// поле ввода растёт по мере набора
function grow() { const t = $('txt'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
$('txt').addEventListener('input', grow);
$('form').onsubmit = send;
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send(e); });
</script>
</body>
</html>
