<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Обмен</title>
<style>
:root{--ink:#1c1f26;--mute:#8a909c;--line:#e6e8ec;--mine:#e8f0fe;--other:#f3f4f6;--accent:#2563eb}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
#code{width:110px;border:0;background:transparent;font:600 20px system-ui,sans-serif;letter-spacing:.2em;color:var(--ink);padding:4px 0}
#code::placeholder{letter-spacing:0;color:var(--mute);font-weight:500}
#code:focus{outline:none}
/* телефон: поле невидимое, тап по верху экрана открывает цифровую клавиатуру */
body.phone header{border-bottom-color:transparent;min-height:56px}
body.phone #code{flex:1;width:auto;color:transparent;caret-color:transparent;-webkit-text-fill-color:transparent;user-select:none}
body.phone #code::placeholder{color:transparent}
body.phone #code:focus-visible{outline:none}
body.phone.in header{border-bottom-color:var(--line)}
#st{flex:1;text-align:right;font-size:13px;color:var(--mute)}

#list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;align-self:flex-start;background:var(--other);border-radius:14px 14px 14px 4px;padding:8px 12px}
.msg.me{align-self:flex-end;background:var(--mine);border-radius:14px 14px 4px 14px}
.msg pre{white-space:pre-wrap;word-break:break-word;font:inherit}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:4px;font-size:12px;color:var(--mute)}
.meta button{background:none;color:var(--accent);padding:0;font-size:12px}

form{display:none;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;color:var(--ink);max-height:40vh}
textarea:focus{outline:none;border-color:var(--accent)}
form button{background:var(--accent);color:#fff;font-weight:600;border-radius:12px;padding:0 16px}
</style>
</head>
<body>

<header>
  <input id="code" inputmode="numeric" maxlength="4" placeholder="Обмен" autocomplete="off" aria-label="Код обмена">
  <span id="st"></span>
</header>
<div id="list"></div>
<form id="form">
  <textarea id="txt" rows="2" placeholder="Текст… (Ctrl+Enter — отправить)"></textarea>
  <button type="submit">Отправить</button>
</form>

<script>
const SERVER = 'https://ntfy.sh';
const SALT = 'bgd31-textchat-v1';   // поменяй на своё
const CHUNK = 1200;
const ME = Math.random().toString(36).slice(2, 10);
const DEVICE = /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Телефон' : 'ПК';

const $ = id => document.getElementById(id);
let es = null, topic = '', seen = new Set(), parts = {}, current = '';

const codeEl = $('code');
if (DEVICE === 'Телефон') { document.body.classList.add('phone'); codeEl.type = 'tel'; }
codeEl.addEventListener('input', () => {
  codeEl.value = codeEl.value.replace(/\D/g, '').slice(0, 4);
  if (codeEl.value.length === 4) { if (codeEl.value !== current) join(codeEl.value); }
  else if (current) leave();
});

async function hash(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 24);
}

async function join(c) {
  leave();
  current = c;
  topic = 'tc' + await hash(SALT + c);
  history.replaceState(null, '', '#' + c);
  $('form').style.display = 'flex';
  document.body.classList.add('in');
  codeEl.blur();
  connect();
  $('txt').focus();
}

function leave() {
  es && es.close(); es = null;
  current = ''; seen.clear(); parts = {};
  $('list').innerHTML = '';
  $('form').style.display = 'none';
  document.body.classList.remove('in');
  $('st').textContent = '';
  history.replaceState(null, '', location.pathname);
}

function connect() {
  $('st').textContent = 'Подключение…';
  es = new EventSource(`${SERVER}/${topic}/sse?since=all`);
  es.onopen = () => $('st').textContent = 'В сети';
  es.onerror = () => $('st').textContent = 'Переподключение…';
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.event !== 'message' || seen.has(m.id)) return;
    seen.add(m.id);
    try { onPart(JSON.parse(m.message), m.time); } catch {}
  };
}

function onPart(p, time) {
  const box = parts[p.m] ||= { n: p.n, got: {}, s: p.s, d: p.d, time };
  box.got[p.i] = p.t;
  if (Object.keys(box.got).length < box.n) return;
  let text = '';
  for (let i = 0; i < box.n; i++) text += box.got[i];
  delete parts[p.m];
  render(text, box.s === ME, box.d, box.time);
}

function render(text, mine, dev, time) {
  const el = document.createElement('div');
  el.className = 'msg' + (mine ? ' me' : '');
  const pre = document.createElement('pre');
  pre.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'meta';
  const t = new Date(time * 1000).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  const info = document.createElement('span');
  info.textContent = `${mine ? 'Вы' : dev || '?'}, ${t}`;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Копировать';
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); }
    btn.textContent = 'Скопировано';
    setTimeout(() => btn.textContent = 'Копировать', 1500);
  };
  meta.append(info, btn);
  el.append(pre, meta);
  const list = $('list');
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  list.append(el);
  if (atBottom || mine) list.scrollTop = list.scrollHeight;
}

async function send(e) {
  e && e.preventDefault();
  const text = $('txt').value;
  if (!text.trim() || !topic) return;
  $('txt').value = '';
  const id = Math.random().toString(36).slice(2, 12);
  const chunks = [];
  for (let i = 0; i < text.length; i += CHUNK) chunks.push(text.slice(i, i + CHUNK));
  try {
    for (let i = 0; i < chunks.length; i++) {
      const r = await fetch(`${SERVER}/${topic}`, {
        method: 'POST',
        body: JSON.stringify({ m: id, i, n: chunks.length, s: ME, d: DEVICE, t: chunks[i] })
      });
      if (!r.ok) throw new Error(r.status);
    }
  } catch (err) {
    $('txt').value = text;
    $('st').textContent = err.message == 429 ? 'Слишком часто, подождите' : 'Не отправлено';
  }
}
$('form').onsubmit = send;
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send(e); });

const h = location.hash.slice(1);
if (/^\d{4}$/.test(h)) { codeEl.value = h; join(h); } else codeEl.focus();
</script>
</body>
</html>
